apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress-org2
  namespace: argocd

spec:
  project: wordpress-org2

  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: wordpress
      targetRevision: 30.0.4
      helm:
        valueFiles:
          - $values/apps/worpdress-org2/values.yaml
    - repoURL: https://github.com/el7-7/argo-demo.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: org2

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
