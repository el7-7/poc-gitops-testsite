apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress-org1
  namespace: argocd

spec:
  project: wordpress-org1

  sources:
    # 1. Helm chart
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: wordpress
      targetRevision: 30.0.4
      helm:
        valueFiles:
          - $values/apps/wordpress-org1/values.yaml
  
    # 2. Values repo (keep ref!)
    - repoURL: https://github.com/el7-7/poc-gitops-testsite.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: org1

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
