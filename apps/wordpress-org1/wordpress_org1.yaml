apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wordpress-org1
  namespace: argocd

  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-cancelled.slack: argocd-notifications

spec:
  project: wordpress-org1

  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: wordpress
      targetRevision: 30.0.4
      helm:
        valueFiles:
          - $values/apps/wordpress-org1/values.yaml

    - repoURL: https://github.com/el7-7/poc-gitops-testsite.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: org1

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
