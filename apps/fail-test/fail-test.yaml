apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-failed.slack: argocd-notifications
    notifications.argoproj.io/subscribe.on-sync-status-change.slack: argocd-notifications
spec:
  project: default
  source:
    repoURL: https://github.com/el7-7/poc-gitops-testsite.git
    targetRevision: main
    path: apps/fail-test
  destination:
    server: https://kubernetes.default.svc
    namespace: org1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
